<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers | Mesokurtic Supply Chain</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-navy: #0f172a;
            --accent-green: #22c55e;
            --white: #ffffff;
            --text-slate: #475569;
            --overlay: rgba(15, 23, 42, 0.8);
            --bg-light: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--primary-navy);
            line-height: 1.6;
        }

        /* --- NAVBAR --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: var(--white);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            height: 45px;
            width: auto;
        }

        .brand-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--primary-navy);
            text-transform: uppercase;
        }

        .brand-name span {
            color: var(--accent-green);
        }

        .menu-btn {
            font-size: 28px;
            cursor: pointer;
            border: none;
            background: none;
        }

        /* --- HERO --- */
        .page-header {
            background: linear-gradient(var(--overlay), var(--overlay)), url('assets/image/hero-bg.png');
            background-size: cover;
            background-position: center;
            padding: 100px 5%;
            color: white;
            text-align: center;
        }

        /* --- DYNAMIC SECTIONS --- */
        .container {
            max-width: 1100px;
            margin: -60px auto 50px;
            padding: 0 20px;
        }

        .update-section {
            background: var(--white);
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .section-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.6rem;
            margin-bottom: 30px;
            border-left: 5px solid var(--accent-green);
            padding-left: 15px;
        }

        .item-loading {
            color: #94a3b8;
            font-style: italic;
        }

        .announcement-item {
            border-bottom: 1px solid #e2e8f0;
            padding: 25px 0;
        }

        .announcement-item:last-child {
            border-bottom: none;
        }

        .date-tag {
            display: inline-block;
            background: #f8fafc;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 10px;
            border: 1px solid #e2e8f0;
        }

        .apply-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            background: var(--primary-navy);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
        }

        .apply-btn:hover {
            background: var(--accent-green);
            color: var(--primary-navy);
        }

        /* --- MODAL --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
        }

        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            border-radius: 12px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 30px;
            cursor: pointer;
        }

        /* SIDE NAV (Standardized) */
        .side-nav {
            position: fixed;
            top: 0;
            right: -350px;
            width: 320px;
            height: 100%;
            background: var(--primary-navy);
            transition: 0.4s;
            padding: 60px 30px;
            z-index: 1500;
        }

        .side-nav.active {
            right: 0;
        }

        .side-nav a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="brand-container">
            <img src="assets/image/logo.png" alt="Logo" class="logo-img">
            <h1 class="brand-name">MESO<span>KURTIC</span></h1>
        </a>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </header>

    <nav class="side-nav" id="sideNav">
        <span style="color:white; font-size:30px; cursor:pointer;" onclick="toggleMenu()">×</span>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="career.html">Careers</a>
        <a href="login.html">Portal Login</a>
    </nav>

    <header class="page-header">
        <h1>CAREERS</h1>
        <p>Operational Excellence Starts With the Right Team</p>
    </header>

    <main class="container">
        <section class="update-section">
            <h2 class="section-title">Announcements</h2>
            <div id="announcements-list">
                <p class="item-loading">Synchronizing with headquarters...</p>
            </div>
        </section>

        <section class="update-section">
            <h2 class="section-title">Open Opportunities</h2>
            <div id="jobs-list">
                <p class="item-loading">Fetching available slots...</p>
            </div>
        </section>
    </main>

    <div id="applyModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 style="margin-bottom: 20px;">Submit Application</h2>
            <form id="resume-form">
                <p style="font-size: 0.9rem; margin-bottom: 20px; color: var(--text-slate);">Applying for: <span
                        id="target-job" style="font-weight: 700;"></span></p>
                <input type="text" placeholder="Full Name" required
                    style="width:100%; padding:12px; margin-bottom:15px; border:1px solid #ddd; border-radius:6px;">
                <input type="email" placeholder="Email Address" required
                    style="width:100%; padding:12px; margin-bottom:15px; border:1px solid #ddd; border-radius:6px;">
                <label style="font-size: 0.8rem; font-weight: 600;">UPLOAD RESUME (PDF)</label>
                <input type="file" accept=".pdf" required style="width:100%; margin-bottom:20px;">
                <button type="submit" class="apply-btn" style="width:100%;">Upload & Submit</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-gate.js';
        import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. Fetch Announcements
        async function loadAnnouncements() {
            const container = document.getElementById('announcements-list');
            try {
                const q = query(collection(db, "announcements"), orderBy("date", "desc"));
                const querySnapshot = await getDocs(q);
                container.innerHTML = '';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    container.innerHTML += `
                        <div class="announcement-item">
                            <span class="date-tag">${data.date}</span>
                            <h3>${data.title}</h3>
                            <p>${data.content}</p>
                        </div>`;
                });
            } catch (e) { container.innerHTML = "Announcements are currently offline."; }
        }

        // 2. Fetch Jobs
        async function loadJobs() {
            const container = document.getElementById('jobs-list');
            try {
                const querySnapshot = await getDocs(collection(db, "jobs"));
                container.innerHTML = '';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    container.innerHTML += `
                        <div class="announcement-item">
                            <h3>${data.role}</h3>
                            <p><strong>Location:</strong> ${data.location}</p>
                            <p>${data.description}</p>
                            <button class="apply-btn" onclick="openModal('${data.role}')">Submit Resume</button>
                        </div>`;
                });
            } catch (e) { container.innerHTML = "Job listings currently unavailable."; }
        }

        window.openModal = (jobTitle) => {
            document.getElementById('target-job').innerText = jobTitle;
            document.getElementById('applyModal').style.display = 'block';
        }

        window.closeModal = () => {
            document.getElementById('applyModal').style.display = 'none';
        }

        loadAnnouncements();
        loadJobs();
    </script>

    <script>
        function toggleMenu() { document.getElementById('sideNav').classList.toggle('active'); }
    </script>
</body>

</html>
