<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesokurtic - Fleet Administration</title>

    <script type="module">
        const session = JSON.parse(localStorage.getItem('mesokurtic_auth'));
        // Strict deterministic check: Admin email required
        if (!session || !session.email.endsWith('@company.com')) {
            window.location.replace('index.html');
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-navy: #0f172a;
            --accent-green: #22c55e;
            --white: #ffffff;
            --text-slate: #475569;
            --overlay: rgba(15, 23, 42, 0.8);
            --bg-light: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--primary-navy);
            line-height: 1.6;
        }

        /* --- NAVBAR --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: var(--white);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--primary-navy);
        }

        .brand-name span {
            color: var(--accent-green);
        }

        .page-header {
            background: linear-gradient(var(--overlay), var(--overlay));
            padding: 60px 5%;
            color: white;
            text-align: center;
        }

        .page-header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem;
            text-transform: uppercase;
        }

        .container {
            max-width: 1100px;
            margin: -40px auto 50px;
            padding: 0 20px;
        }

        .section-card {
            background: var(--white);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .section-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.3rem;
            margin-bottom: 20px;
            border-left: 5px solid var(--accent-green);
            padding-left: 15px;
            text-transform: uppercase;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 15px;
        }

        input,
        select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 1rem;
        }

        .btn-add {
            background: var(--primary-navy);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-add:hover {
            background: var(--accent-green);
            color: var(--primary-navy);
        }

        .fleet-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            padding: 20px;
            margin-bottom: 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
        }

        .status-active {
            background: #dcfce7;
            color: #166534;
        }

        .status-maintenance {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-inactive {
            background: #f1f5f9;
            color: #475569;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="brand-name">MESO<span>KURTIC</span></a>
        <div style="display: flex; gap: 20px;">
            <a href="menu.html" style="text-decoration:none; font-weight:600; color:var(--primary-navy)">Menu</a>
            <div style="font-weight: 600; color: var(--accent-green);">Operations Portal</div>
        </div>
    </nav>

    <header class="page-header">
        <h1>Fleet Administration</h1>
    </header>

    <div class="container">
        <div class="section-card">
            <h2 class="section-title">Register New Vehicle</h2>
            <div class="form-grid">
                <input type="text" id="truckIdInput" placeholder="Truck ID (e.g. TRK-009)">
                <select id="statusInput">
                    <option value="ACTIVE">ACTIVE</option>
                    <option value="MAINTENANCE">MAINTENANCE</option>
                    <option value="INACTIVE">INACTIVE</option>
                </select>
                <button class="btn-add" id="saveBtn">Save Vehicle</button>
            </div>
        </div>

        <div class="section-card">
            <h2 class="section-title">Live Fleet Inventory</h2>
            <div id="fleet-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "mesokurtic-live.firebaseapp.com",
            projectId: "mesokurtic-live",
            storageBucket: "mesokurtic-live.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const fleetRef = collection(db, "fleet");

        // UI DOM ELEMENTS
        const listArea = document.getElementById("fleet-list");
        const saveBtn = document.getElementById('saveBtn');
        const truckInput = document.getElementById('truckIdInput');
        const statusInput = document.getElementById('statusInput');

        // REPOSITORY PATTERN: Deterministic Save
        saveBtn.addEventListener('click', async () => {
            const truckId = truckInput.value.trim().toUpperCase();
            const status = statusInput.value;

            if (!truckId) return alert("System Invariant: Truck ID required.");

            saveBtn.disabled = true; // State lock
            try {
                await addDoc(fleetRef, {
                    truckId,
                    status,
                    createdAt: serverTimestamp()
                });
                truckInput.value = "";
            } catch (error) {
                console.error("Ledger Write Error:", error);
            } finally {
                saveBtn.disabled = false;
            }
        });

        // VIEW ADAPTER: Deterministic Rendering (No innerHTML += leaks)
        onSnapshot(fleetRef, (snapshot) => {
            listArea.textContent = ""; // Clear state safely

            if (snapshot.empty) {
                const emptyMsg = document.createElement('p');
                emptyMsg.style.textAlign = "center";
                emptyMsg.textContent = "No vehicles currently registered.";
                listArea.appendChild(emptyMsg);
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const card = document.createElement('div');
                card.className = 'fleet-card';

                // Deterministic Node Creation (Anti-XSS)
                card.innerHTML = `
                    <div>
                        <small style="color: #94a3b8; font-size: 0.7rem;">UID: ${doc.id.substring(0, 8)}</small>
                        <h3 style="color: var(--primary-navy); margin-top: 4px;">${data.truckId}</h3>
                    </div>
                    <span class="status-badge status-${data.status.toLowerCase()}">${data.status}</span>
                `;
                listArea.appendChild(card);
            });
        });
    </script>
</body>

</html>
