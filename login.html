<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Mesokurtic Supply Chain</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-navy: #0f172a;
            --accent-green: #22c55e;
            --white: #ffffff;
            --text-slate: #475569;
            --bg-light: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--primary-navy);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Subtle background pattern for a technical feel */
            background-image: radial-gradient(#cbd5e1 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }

        .login-container {
            background: var(--white);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .logo-img {
            height: 60px;
            margin-bottom: 15px;
        }

        .brand-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.6rem;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .brand-name span {
            color: var(--accent-green);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            text-align: left;
        }

        .input-group label {
            display: block;
            font-weight: 700;
            font-size: 0.75rem;
            margin-bottom: 8px;
            color: var(--text-slate);
            letter-spacing: 0.1em;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
        }

        .login-btn {
            background: var(--primary-navy);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            font-family: 'Montserrat', sans-serif;
        }

        .login-btn:hover {
            background: #1e293b;
            transform: translateY(-2px);
        }

        .login-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <img src="assets/image/logo.png" alt="Mesokurtic" class="logo-img">
        <div class="brand-name">MESO<span>KURTIC</span></div>

        <form id="login-form" class="login-form">
            <div class="input-group">
                <label for="email">ADMINISTRATOR ID</label>
                <input type="email" id="email" name="email" required placeholder="admin@mesokurtic.com">
            </div>

            <div class="input-group">
                <label for="password">SECURITY KEY</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <button type="submit" id="submit-btn" class="login-btn">INITIALIZE SESSION</button>
        </form>

        <div class="footer-note">Secure Logistics Gateway &copy; 2026</div>
    </div>

    <script type="module">
        import { auth, signInWithEmailAndPassword } from './firebase-gate.js';

        const loginForm = document.querySelector('#login-form');
        const submitBtn = document.querySelector('#submit-btn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Visual feedback for state change
            submitBtn.disabled = true;
            submitBtn.innerText = "VERIFYING...";

            const email = loginForm['email'].value;
            const password = loginForm['password'].value;

            try {
                await signInWithEmailAndPassword(auth, email, password);

                // Set session local storage to assist menu.html dynamic links
                localStorage.setItem('mesokurtic_admin_session', 'true');

                window.location.replace("dashboard.html");
            } catch (error) {
                console.error("Login Error:", error.code);
                alert("Authorization Denied: " + error.message);

                // Reset state on failure
                // submitBtn.disabled = false;
                submitBtn.innerText = "INITIALIZE SESSION";
            }
        });
    </script>
</body>

</html>
