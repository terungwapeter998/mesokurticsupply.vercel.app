<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Mesokurtic Supply Chain</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-navy: #0f172a;
            --accent-green: #22c55e;
            --white: #ffffff;
            --slate-text: #64748b;
            --bg-gradient: radial-gradient(circle at top left, #1e293b, #0f172a);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--white);
            overflow: hidden;
        }

        /* --- TOPBAR --- */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            z-index: 1000;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            height: 40px;
            width: auto;
        }

        .brand-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--white);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .brand-name span {
            color: var(--accent-green);
        }

        .menu-btn {
            font-size: 28px;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--white);
        }

        /* --- LOGIN CARD --- */
        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--white);
            color: var(--primary-navy);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .auth-card h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.6rem;
            margin-bottom: 8px;
            text-align: center;
        }

        .auth-card p {
            font-size: 0.85rem;
            color: var(--slate-text);
            text-align: center;
            margin-bottom: 30px;
        }

        /* --- FORM ELEMENTS --- */
        form label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        form input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f8fafc;
            font-size: 1rem;
            transition: 0.2s ease;
        }

        form input:focus {
            outline: none;
            border-color: var(--accent-green);
            background: white;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary-navy);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        .btn-primary:hover {
            background: #1e293b;
            transform: translateY(-1px);
        }

        /* --- FOOTER --- */
        .footer {
            padding: 25px;
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.6;
            color: var(--white);
        }

        /* --- SIDE DRAWER --- */
        .side-nav {
            position: fixed;
            top: 0;
            right: -320px;
            width: 310px;
            height: 100%;
            background: var(--primary-navy);
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 60px 30px;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            color: var(--white);
        }

        .side-nav.active {
            right: 0;
        }

        .nav-label {
            color: #64748b;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin: 25px 0 10px;
            font-weight: 700;
        }

        .side-nav a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
        }

        .side-nav a:hover {
            color: var(--accent-green);
            padding-left: 10px;
        }

        .close-btn {
            color: white;
            font-size: 40px;
            cursor: pointer;
            position: absolute;
            top: 20px;
            right: 20px;
        }

        /* --- LARGER PORTAL BUTTON (Synchronized Size) --- */
        .portal-link-active {
            margin-top: 40px;
            background: var(--accent-green) !important;
            color: var(--primary-navy) !important;
            text-align: center;
            font-weight: 800;
            border-radius: 10px;
            display: block;
            padding: 20px 10px !important;
            font-size: 1.2rem !important;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <header class="topbar">
        <a href="index.html" class="brand-container">
            <img src="assets/image/logo.png" alt="Logo" class="logo-img">
            <h1 class="brand-name">MESO<span>KURTIC</span></h1>
        </a>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </header>

    <nav class="side-nav" id="sideNav">
        <span class="close-btn" onclick="toggleMenu()">×</span>
        <p class="nav-label">Corporate</p>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="career.html">Careers</a>
        <a href="services.html">Services</a>
        <p class="nav-label">Management</p>
        <a href="dashboard.html">Dashboard</a>
        <a href="operations.html">Operations</a>
        <a href="login.html" class="portal-link-active">Portal Active</a>
    </nav>

    <main class="auth-container">
        <section class="auth-card">
            <h1>System Login</h1>
            <p>Enter your credentials to access the logistics control center.</p>

            <form id="login-form">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="admin@mesokurtic.com" required
                    autocomplete="username">

                <label for="password">Security Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required
                    autocomplete="current-password">

                <button type="submit" class="btn-primary">
                    Secure Login
                </button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Mesokurtic Supply Chain Limited. All Rights Reserved.</p>
    </footer>

    <script>
        function toggleMenu() {
            document.getElementById('sideNav').classList.toggle('active');
        }

        // Handle Login Submission
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            console.log("Authentication logic triggering for:", email);

            // For now, simple simulation
            if (email && password) {
                alert("Authenticating... Redirecting to Dashboard.");
                window.location.href = "dashboard.html";
            }
        });

        // Close navigation on outside click
        document.addEventListener('click', (e) => {
            const nav = document.getElementById('sideNav');
            const btn = document.querySelector('.menu-btn');
            if (nav.classList.contains('active')) {
                if (!nav.contains(e.target) && !btn.contains(e.target)) {
                    nav.classList.remove('active');
                }
            }
        });
    </script>
</body>

</html>
