<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Menu | Mesokurtic</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-navy: #0f172a;
            --accent-green: #22c55e;
            --white: #ffffff;
            --bg-light: #f1f5f9;
            --text-slate: #cbd5e1;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            display: flex;
            justify-content: flex-end;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .menu-card {
            background: var(--primary-navy);
            width: 100%;
            max-width: 420px;
            height: 100vh;
            box-shadow: -20px 0 60px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            animation: slideIn 0.4s ease-out;
            overflow-y: auto;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0);
            }
        }

        .hero-section {
            width: 100%;
            height: 220px;
            position: relative;
            overflow: hidden;
        }

        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: brightness(0.7);
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.2), var(--primary-navy));
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            box-sizing: border-box;
        }

        .menu-content {
            padding: 0 40px 40px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 2.2rem;
            text-decoration: none;
            z-index: 10;
            line-height: 1;
        }

        .brand {
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            text-decoration: none;
            margin-bottom: 5px;
        }

        .brand span {
            color: var(--accent-green);
        }

        .nav-label {
            color: #64748b;
            font-size: 0.7rem;
            text-transform: uppercase;
            margin: 25px 0 8px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .menu-card a:not(.brand, .close-btn) {
            color: var(--text-slate);
            text-decoration: none;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-card a:hover:not(.portal-link) {
            color: var(--accent-green);
            padding-left: 10px;
        }

        .lock-icon {
            font-size: 0.8rem;
            opacity: 0.5;
        }

        .portal-link {
            margin-top: 30px;
            background: var(--accent-green);
            color: var(--primary-navy) !important;
            text-align: center;
            font-weight: 700;
            border-radius: 8px;
            padding: 15px !important;
            justify-content: center !important;
            transition: transform 0.2s;
        }
    </style>
</head>

<body>

    <div class="menu-card">
        <a href="javascript:history.back()" class="close-btn">&times;</a>

        <div class="hero-section">
            <img src="https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&q=80&w=1000"
                alt="Mesokurtic Logistics" class="hero-img">
            <div class="hero-overlay">
                <a href="index.html" class="brand">
                    MESO<span>KURTIC</span>
                </a>
                <div style="color:rgba(255,255,255,0.6); font-size: 0.8rem;">Supply Chain Excellence</div>
            </div>
        </div>

        <div class="menu-content">
            <p class="nav-label">Corporate</p>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="services.html">Services</a>
            <a href="air-cargo.html">Air Cargo Dispatch</a>
            <a href="career.html">Careers</a>
            <a href="contact.html">Contact</a>

            <p class="nav-label">Operational Intelligence</p>
            <a href="dashboard.html">Dashboard <span class="lock-icon">🔒</span></a>
            <a href="fleet-dashboard.html">Logistics Fleet <span class="lock-icon">🔒</span></a>
            <a href="analytics.html">System Analytics <span class="lock-icon">🔒</span></a>

            <a href="login.html" id="auth-gate-link" class="portal-link">Admin Access</a>
        </div>


        <script>
            const portalLink = document.getElementById('auth-gate-link');
            const sessionActive = localStorage.getItem('mesokurtic_admin_session') === 'true';
            if (sessionActive) {
                portalLink.innerText = "Open Console";
                portalLink.href = "dashboard.html";
            } else {
                portalLink.innerText = "Admin Login";
                portalLink.href = "login.html";
            }
        </script>
</body>

</html>
