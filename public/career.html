<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers | Mesokurtic Supply Chain</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-navy: #0f172a;
            --accent-green: #22c55e;
            --white: #ffffff;
            --text-slate: #475569;
            --overlay: rgba(15, 23, 42, 0.8);
            --bg-light: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--primary-navy);
            line-height: 1.6;
        }

        /* --- NAVBAR --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: var(--white);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            height: 45px;
            width: auto;
        }

        .brand-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--primary-navy);
            text-transform: uppercase;
        }

        .brand-name span {
            color: var(--accent-green);
        }

        .menu-btn {
            font-size: 28px;
            cursor: pointer;
            border: none;
            background: none;
        }

        /* --- HERO --- */
        .page-header {
            background: linear-gradient(var(--overlay), var(--overlay)), url('assets/image/hero-bg.png');
            background-size: cover;
            background-position: center;
            padding: 100px 5%;
            color: white;
            text-align: center;
        }

        /* --- CONTENT --- */
        .container {
            max-width: 1100px;
            margin: -60px auto 50px;
            padding: 0 20px;
        }

        .update-section {
            background: var(--white);
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .section-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.6rem;
            margin-bottom: 30px;
            border-left: 5px solid var(--accent-green);
            padding-left: 15px;
        }

        .announcement-item {
            border-bottom: 1px solid #e2e8f0;
            padding: 25px 0;
        }

        .announcement-item:last-child {
            border-bottom: none;
        }

        .date-tag {
            display: inline-block;
            background: #f8fafc;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 10px;
            border: 1px solid #e2e8f0;
        }

        .apply-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            background: var(--primary-navy);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .apply-btn:hover {
            background: var(--accent-green);
            color: var(--primary-navy);
        }

        /* --- MODAL --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
        }

        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            border-radius: 12px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 30px;
            cursor: pointer;
        }

        /* SIDE NAV */
        .side-nav {
            position: fixed;
            top: 0;
            right: -350px;
            width: 320px;
            height: 100%;
            background: var(--primary-navy);
            transition: 0.4s;
            padding: 60px 30px;
            z-index: 1500;
        }

        .side-nav.active {
            right: 0;
        }

        .side-nav a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="brand-container">
            <img src="assets/image/logo.png" alt="Logo" class="logo-img">
            <h1 class="brand-name">MESO<span>KURTIC</span></h1>
        </a>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </header>

    <nav class="side-nav" id="sideNav">
        <span style="color:white; font-size:30px; cursor:pointer;" onclick="toggleMenu()">×</span>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="career.html">Careers</a>
        <a href="login.html">Portal Login</a>
    </nav>

    <header class="page-header">
        <h1>CAREERS</h1>
        <p>Operational Excellence Starts With the Right Team</p>
    </header>

    <main class="container">
        <section class="update-section">
            <h2 class="section-title">Latest Updates</h2>
            <div id="announcements-list">
                <p style="color:#94a3b8;">Checking for updates...</p>
            </div>
        </section>

        <section class="update-section">
            <h2 class="section-title">Open Opportunities</h2>
            <div id="jobs-list">
                <p style="color:#94a3b8;">Scanning for vacancies...</p>
            </div>
        </section>
    </main>

    <div id="applyModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 style="margin-bottom: 10px;">Apply Now</h2>
            <p style="font-size: 0.9rem; margin-bottom: 20px; color: var(--text-slate);">
                Position: <span id="target-job" style="font-weight: 700; color: var(--accent-green);"></span>
            </p>
            <form id="resume-form">
                <input type="text" id="app-name" placeholder="Full Name" required
                    style="width:100%; padding:12px; margin-bottom:15px; border:1px solid #ddd; border-radius:6px;">
                <input type="email" id="app-email" placeholder="Email Address" required
                    style="width:100%; padding:12px; margin-bottom:15px; border:1px solid #ddd; border-radius:6px;">

                <label style="font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 5px;">LINK TO RESUME
                    (Drive/Dropbox/PDF Link)</label>
                <input type="url" id="app-resume" placeholder="https://..." required
                    style="width:100%; padding:12px; margin-bottom:20px; border:1px solid #ddd; border-radius:6px;">

                <button type="submit" class="apply-btn" id="submit-app-btn" style="width:100%;">Submit
                    Application</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-gate.js';
        import {
            collection,
            getDocs,
            addDoc,
            query,
            orderBy,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. Load Announcements
        async function loadAnnouncements() {
            const container = document.getElementById('announcements-list');
            try {
                const q = query(collection(db, "announcements"), orderBy("date", "desc"));
                const snap = await getDocs(q);
                if (snap.empty) {
                    container.innerHTML = "<p style='color:#94a3b8;'>No new announcements at this time.</p>";
                    return;
                }
                container.innerHTML = '';
                snap.forEach(doc => {
                    const data = doc.data();
                    container.innerHTML += `
                        <div class="announcement-item">
                            <span class="date-tag">${data.date}</span>
                            <h3>${data.title}</h3>
                            <p>${data.content}</p>
                        </div>`;
                });
            } catch (e) { container.innerHTML = "Unable to load updates."; }
        }

        // 2. Load Jobs or Show General Application
        async function loadJobs() {
            const container = document.getElementById('jobs-list');
            try {
                const snap = await getDocs(collection(db, "jobs"));
                container.innerHTML = '';

                if (snap.empty) {
                    // Scenario: No active vacancy, show general talent pool option
                    container.innerHTML = `
                        <div class="announcement-item">
                            <h3>General Talent Pool</h3>
                            <p>We are not actively hiring for specific roles right now, but we are always looking for great talent. Submit your resume and we will contact you when a vacancy opens.</p>
                            <button class="apply-btn" onclick="openModal('General Application')">Submit to Talent Pool</button>
                        </div>`;
                } else {
                    snap.forEach(doc => {
                        const data = doc.data();
                        container.innerHTML += `
                            <div class="announcement-item">
                                <h3>${data.role}</h3>
                                <p><strong>Location:</strong> ${data.location}</p>
                                <p>${data.description}</p>
                                <button class="apply-btn" onclick="openModal('${data.role}')">Apply for this Role</button>
                            </div>`;
                    });
                }
            } catch (e) { container.innerHTML = "Job listings currently unavailable."; }
        }

        // 3. Application Submission Logic
        const applyForm = document.getElementById('resume-form');
        applyForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-app-btn');
            btn.innerText = "Submitting...";
            btn.disabled = true;

            const applicationData = {
                candidateName: document.getElementById('app-name').value,
                email: document.getElementById('app-email').value,
                resumeLink: document.getElementById('app-resume').value,
                roleApplied: document.getElementById('target-job').innerText,
                submittedAt: serverTimestamp()
            };

            try {
                await addDoc(collection(db, "applications"), applicationData);
                alert("Application submitted successfully! Our HR team will review it.");
                closeModal();
                applyForm.reset();
            } catch (err) {
                alert("Error submitting application. Please try again.");
                console.error(err);
            } finally {
                btn.innerText = "Upload & Submit";
                btn.disabled = false;
            }
        });

        // Modal Helpers
        window.openModal = (jobTitle) => {
            document.getElementById('target-job').innerText = jobTitle;
            document.getElementById('applyModal').style.display = 'block';
        }
        window.closeModal = () => {
            document.getElementById('applyModal').style.display = 'none';
        }

        loadAnnouncements();
        loadJobs();
    </script>

    <script>
        function toggleMenu() { document.getElementById('sideNav').classList.toggle('active'); }
    </script>

    <script type="module" src="./js/state.js"></script>
    <script type="module" src="./js/auth.js"></script>
</body>

</html>
